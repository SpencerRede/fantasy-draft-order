name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Runs on every pull request AND on push to main. Validates the Worker
  # builds and all tests pass BEFORE anything is deployed. `wrangler deploy
  # --dry-run` compiles the Worker and checks bindings/config without
  # publishing and without needing Cloudflare secrets.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Build first: the workers-pool tests and the dry-run both read
      # wrangler.toml's [assets] directory (./dist), which must exist.
      - run: npm run build
      - run: npm test
      - run: npm run test:workers
      - name: Validate Worker (dry-run, no deploy)
        run: npx wrangler deploy --dry-run

  # Deploys only after ci passes, and only for pushes to main (never on PRs).
  deploy:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name = "fantasy-draft-order"
main = "src/server/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "RACE_ROOM"
class_name = "RaceRoom"

# Durable Objects on the free plan require the SQLite storage backend, so the
# class must be created with new_sqlite_classes. The ctx.storage KV API we use
# works unchanged on this backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceRoom"]
